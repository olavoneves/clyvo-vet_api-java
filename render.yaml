services:
  - type: web
    name: clyvo-vet-api
    runtime: docker
    plan: free
    branch: main
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      # Sem esta chave a aplicacao sobe igual; so o agente de agendamento
      # responde 503.
      - key: ANTHROPIC_API_KEY
        sync: false
