<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: pagina('Agenda', ~{::main}, ~{})}">
<head><title>Agenda</title></head>
<body>

<main class="conteudo">

    <div class="cabecalho-tela">
        <div>
            <h1>Agenda de atendimentos</h1>
            <p class="subtitulo"
               th:text="|${#temporals.format(inicio, 'dd/MM')} a ${#temporals.format(fim, 'dd/MM/yyyy')} · hoje é ${#temporals.format(hoje, 'dd/MM')}|">Semana</p>
            <!--
              O contador so aparece quando ha o que contar. Um "0 recuperados" fixo
              no cabecalho vira ruido e a clinica para de ler a linha.
            -->
            <p class="subtitulo" th:if="${recuperadosNaSemana > 0}">
                <span class="etiqueta etiqueta-recuperada">Em atraso</span>
                <span th:text="|${recuperadosNaSemana} atendimento(s) recuperam obrigação vencida|">—</span>
            </p>
        </div>
        <div class="cabecalho-acoes">
            <!--
              Os links carregam o filtro: andar de semana nao pode desligar o
              recorte por veterinario que acabou de ser escolhido.
            -->
            <nav class="navegacao-mes" aria-label="Semanas">
                <a class="botao-secundario"
                   th:href="${ehVeterinario} ? @{/agenda(inicio=${semanaAnterior},minha=${minhaAgenda})} : @{/agenda(inicio=${semanaAnterior})}">&larr; Semana anterior</a>
                <a class="botao-secundario"
                   th:href="${ehVeterinario} ? @{/agenda(minha=${minhaAgenda})} : @{/agenda}">Hoje</a>
                <a class="botao-secundario"
                   th:href="${ehVeterinario} ? @{/agenda(inicio=${proximaSemana},minha=${minhaAgenda})} : @{/agenda(inicio=${proximaSemana})}">Próxima semana &rarr;</a>
            </nav>
            <nav class="alternancia" aria-label="De quem é a agenda" th:if="${ehVeterinario}">
                <a th:href="@{/agenda(inicio=${inicio},minha=true)}"
                   th:classappend="${minhaAgenda} ? 'ativo'"
                   th:attr="aria-current=${minhaAgenda} ? 'true'">Minha agenda</a>
                <a th:href="@{/agenda(inicio=${inicio},minha=false)}"
                   th:classappend="${!minhaAgenda} ? 'ativo'"
                   th:attr="aria-current=${!minhaAgenda} ? 'true'">Clínica inteira</a>
            </nav>
        </div>
    </div>

    <section class="bloco" th:if="${vazia}">
        <p class="tabela-vazia"
           th:text="${minhaAgenda} ? 'Nenhum atendimento seu marcado nestes sete dias.' : 'Nenhum atendimento marcado nestes sete dias.'">Nada marcado.</p>
    </section>

    <!--
      Um bloco por dia, com a mesma tabela. O fragmento evita que os dias
      divirjam quando a tabela for ajustada.
    -->
    <th:block th:unless="${vazia}">
        <section class="bloco" th:each="dia : ${dias}" th:classappend="${dia.hoje} ? 'bloco-hoje'">
            <h2 class="titulo-bloco" th:text="${dia.rotulo}">Dia</h2>
            <div th:replace="~{agenda/lista :: tabelaCompromissos(${dia.compromissos}, 'Nada marcado neste dia.')}"></div>
        </section>
    </th:block>

</main>

<div th:fragment="tabelaCompromissos(compromissos, vazio)" class="tabela-rolagem">
    <table class="tabela">
        <thead>
        <tr>
            <th>Quando</th>
            <th>Pet</th>
            <th>Veterinário</th>
            <th>Motivo</th>
            <th>Origem</th>
            <th>Situação</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="c : ${compromissos}"
            th:classappend="${c.recuperaAtraso} ? 'linha-recuperada' : ''">

            <td th:text="|${#temporals.format(c.data, 'dd/MM')} às ${c.hora}|">—</td>

            <td><a th:href="@{/pets/{id}(id=${c.petId})}" th:text="${c.petNome}">Pet</a></td>

            <td th:text="${c.veterinarioNome}">Veterinário</td>

            <!--
              Sem obrigacao atras, o compromisso veio do balcao: dizer isso e
              melhor do que deixar a celula vazia, que se le como dado faltando.
            -->
            <td th:if="${c.veioDeObrigacao}">
                <span th:text="${c.etapaNome}">Etapa</span>
                <span class="subtitulo" th:text="${c.protocoloNome}">Protocolo</span>
            </td>
            <td th:unless="${c.veioDeObrigacao}" class="subtitulo">Marcado pela clínica</td>

            <td th:text="${c.canalOrigem}">—</td>

            <td>
                <span class="etiqueta"
                      th:classappend="'etiqueta-' + ${#strings.toLowerCase(c.status)}"
                      th:text="${c.status}">STATUS</span>
                <!--
                  A marca do atraso vem com o numero de dias: "recupera atraso"
                  sozinho nao diz se a clinica perdeu dois dias ou dois meses.
                -->
                <span th:if="${c.recuperaAtraso}"
                      class="etiqueta etiqueta-recuperada"
                      th:text="|em atraso · ${c.diasDeAtraso}d|"
                      th:title="|Vencia em ${#temporals.format(c.dtPrevista, 'dd/MM/yyyy')}|">em atraso</span>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(compromissos)}">
            <td colspan="6" class="tabela-vazia" th:text="${vazio}">Nada marcado.</td>
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>
