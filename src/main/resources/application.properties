spring.application.name=clyvo-vet
server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# O schema e governado pelas migrations do Flyway, nunca pelo Hibernate.
# validate: a aplicacao nao sobe se o mapeamento divergir do banco.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
# V0 a V8 ja estao aplicadas manualmente no schema Oracle da FIAP. Baseline acima
# da ultima versao existente evita que V7/V8 tentem recriar coluna (ORA-01430).
spring.flyway.baseline-version=8
spring.flyway.baseline-description=schema pre-existente (V0-V8 aplicadas via DBA)

spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

app.jwt.secret=${APP_JWT_SECRET}
app.jwt.access-token-expiration-ms=900000
app.jwt.refresh-token-expiration-ms=604800000
