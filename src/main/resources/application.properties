spring.application.name=clyvo-vet
server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# O Oracle da FIAP e compartilhado e tem teto de sessoes por usuario: um pool
# grande nao acelera nada e ainda arrisca esgotar a cota no meio da demo.
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=20000

# O schema e governado pelas migrations do Flyway, nunca pelo Hibernate.
# validate: a aplicacao nao sobe se o mapeamento divergir do banco.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
# V0 a V8 ja estao aplicadas manualmente no schema Oracle da FIAP. Baseline acima
# da ultima versao existente evita que V7/V8 tentem recriar coluna (ORA-01430).
spring.flyway.baseline-version=8
spring.flyway.baseline-description=schema pre-existente (V0-V8 aplicadas via DBA)

spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-expiration-ms=900000
app.jwt.refresh-token-expiration-ms=604800000

# Nunca devolver stack trace nem mensagem de excecao no corpo da resposta:
# o diagnostico vai para o log, onde so quem opera o sistema alcanca.
#
# add-properties=false desliga os defaults que o devtools injeta em
# desenvolvimento — entre eles include-stacktrace=always, que vence as linhas
# abaixo e faz o ambiente local se comportar diferente do empacotado. Preferimos
# que dev e producao errem igual: um vazamento assim tem que aparecer aqui.
spring.devtools.add-properties=false
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

# Limite por IP, em memoria. As rotas de autenticacao levam um teto muito
# menor: 100 tentativas de senha por minuto seria forca bruta a vontade.
app.rate-limit.habilitado=true
app.rate-limit.autenticacao-por-minuto=5
app.rate-limit.padrao-por-minuto=100
app.rate-limit.rotas-de-autenticacao=/api/auth/login,/api/auth/refresh,/login
# A aplicacao roda atras do proxy da plataforma: sem este cabecalho todos os
# clientes dividiriam um unico balde. Deixe vazio se nao houver proxy confiavel.
app.rate-limit.cabecalho-de-ip=X-Forwarded-For

# Lista explicita de origens; vazio = nenhuma chamada cruzada.
# Nunca use "*" aqui: com allowCredentials o proprio navegador recusa.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# Somente health, info e metrics. /actuator/health e publico para o health
# check do container; o resto exige autenticacao.
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
